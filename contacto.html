            <p>
                Si deseas comunicarte conmigo, puedes completar
                el siguiente formulario.
            </p>
               
        </section>

        <section>
            <h2>Formulario de contacto</h2>

            <form action="#" method="post">

                <p>
                    <label for="nombre">Nombre:</label>
                    <br>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required>
                </p>

                <p>
                    <label for="correo">Correo electrónico:</label>
                    <br>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required>
                </p>

                <p>
                    <label for="mensaje">Mensaje:</label>
                    <br>
                    <textarea
                        id="mensaje"
                        name="mensaje"
                        rows="8"
                        cols="40"
                        required></textarea>
                </p>

                <p>
                    <button type="submit">Enviar</button>
                </p>

            </form>
        </section>

    </main>
